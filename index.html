<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CUBOX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: 'Press Start 2P', monospace;
}

canvas {
  display: block;
  background: #87CEEB;
  font-family: 'Press Start 2P', monospace;
}


/* Contenedor de controles */
/* Contenedor normal de controles */
#controls {
  position: fixed;
  bottom: 10px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  pointer-events: none; /* ← importante, evita que tape clicks */
}

.left-controls,
.right-controls {
  display: flex;
  gap: 10px;
  pointer-events: auto; /* ← los hijos sí reciben toques */
}

/* Fondo borroso */
#blur-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(5px);
  background: rgba(0,0,0,0.2);
  display: none;
  z-index: 900;
}

/* Botón de pausa pequeño */
#pause-btn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 30px;
  background-color: rgba(100,100,100,0.6);
  color: white;
  border: 2px solid white;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  z-index: 1000;
  touch-action: manipulation;
  display: flex;
  flex-direction: column;
  justify-content: space-around; /* distribuye las barras */
  align-items: center;
  box-sizing: border-box;
}



/* Menú de pausa */
#pause-menu {
  position: fixed;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: 250px;
  background-color: rgba(100,100,100,0.6);
  border: 2px solid #000;
  display: none;
  flex-direction: column;
  align-items: center;
  font-family: 'Press Start 2P', monospace;
  z-index: 1001;
}

.menu-btn {
  margin: 5px;
  font-size: 16px;
padding: 5px 10px;
background: #2ecc71;
color: black;
border: 4px solid #000;
cursor: pointer;
image-rendering: pixelated;
box-shadow: 4px 4px 0 #000;
transition: transform 0.1s;

font-family: 'Press Start 2P',
monospace;
}
/* Panel de ajustes deslizable desde la derecha */
#settings-panel {
  position: fixed;
  top: 50px;
  right: -240px; /* fuera de la pantalla al inicio */
  width: 220px;
  height: 250px;
  background-color: rgba(100,100,100,0.6);
  border: 2px solid #000;
  display: flex;
  flex-direction: column;
  z-index: 1002;
  transition: right 0.3s ease;
}
/* ✅ Asegura que también funcione en el 3x3 */
.craft-slot-3x3.selected {
  border: 2px solid #00FF2E !important;
}

#settings-panel.active {
  right: 10px; /* cuando está abierto */
}

#settings-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: rgba(100,100,100,0.6);
  border-bottom: 1px solid #000000;
  padding: 4px 8px;
  font-family: 'Press Start 2P', monospace;
}

#close-settings {
  cursor: pointer;
}

#settings-content {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
}
#volume-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #4A00FF59;
  border: 2px solid #03F2FF;
  
  padding: 4px 8px;
  margin: 6px 0;
  font-family: 'Press Start 2P', monospace;
}

#volume-controls button {
  background: #00FFAB;
  color: #000;
  border: 2px solid #000;
  border-radius: 4px;
  padding: 4px 8px;
  margin: 0 4px;
  cursor: pointer;
  font-family: 'Press Start 2P', monospace;
}

#volume-controls button:hover {
  background: #666;
}

#vol-label {
  min-width: 30px;
  text-align: center;
}

p {
  font-family: 'Press Start 2P', monospace;
  margin: 6px 0;
  text-align: center;
}

#music-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 10px 0;
  gap: 8px;
}

#prevTrack,
#nextTrack {
  background-color: #0029FF;
  color: #fff;
  border: 2px solid #000;
  
  padding: 6px 12px;
  cursor: pointer;
  font-family: 'Press Start 2P', monospace;
  transition: background 0.2s;
  font-size: 10px;
}

#prevTrack:hover,
#nextTrack:hover {
  background-color: #13FF00;
}

#currentTrack {
  font-family: 'Press Start 2P', monospace;
  min-width: 120px;
  max-width: 180px;
  text-align: center;
  display: inline-block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 8px; /* texto más pequeño */
}

.setting-btn {
  background: #09FF003B;
  color: #000;
  border: 2px solid #000;
  padding: 6px;
  margin: 4px 0;
  width: 100%;
  text-align: center;
  cursor: pointer;
  user-select: none;
}

/* Botón PRI separado y más arriba */
#pri-container {
  position: fixed;
  right: 10px;
  bottom: 100px; /* más arriba que los otros botones */
  z-index: 10;
}

/* Estilo común para todos los botones */
.control-btn {
  width: 64px;
  height: 40px;
  background-color: rgba(100, 100, 100, 0.5);
  border: 2px solid white;
  color: white;
  text-align: center;
  line-height: 40px;
  font-weight: bold;
  border-radius: 8px;
  user-select: none;
  touch-action: none;
}

/* PRI activo */
#pri-btn.active {
  background-color: rgba(200, 50, 50, 0.7);
}



.control-btn.active {
  outline: 3px solid yellow; /* borde sin afectar tamaño */
  border: 2px solid white;   /* borde original se mantiene */
  box-shadow: none;
  transform: none;
}




#inventory-btn {
  position: fixed;
  left: 10px;
  bottom: 100px;
  width: 60px;
  height: 40px;
  background-color: rgba(100, 100, 100, 0.6);
  color: white;
  border: 2px solid white;
  border-radius: 6px;
  font-weight: bold;
  font-family: 'Press Start 2P', monospace;
  cursor: pointer;
  z-index: 40;
  touch-action: manipulation;
  display: flex;
  justify-content: center;
  align-items: center;
}

#inventory-btn:active {
  background-color: rgba(120, 120, 120, 0.8);
}


#fps-counter {
  position: fixed;
  top: 5px;
  left: 5px;
  color: white;
  background: rgba(0, 0, 0, 0.5);
  padding: 4px 6px;
  border-radius: 4px;
  font-family: 'Press Start 2P', monospace;
  display: none;
  font-size: 10px;
  z-index: 50;
}


#object-controls {
  position: fixed;
  bottom: 10px;
  left: 300px;
  width: 220px;
  background: #111;
  border: 2px solid #0f0;
  color: #0f0;
  font-family: monospace;
  padding: 10px;
  z-index: 100;
  user-select: none;
  box-shadow: 4px 4px 0 #000;
  cursor: grab;
}

#object-controls.dragging {
  cursor: grabbing;
}

#settings-header {
  font-weight: bold;
  text-align: center;
  margin-bottom: 5px;
}

#panel-msg {
  text-align: center;
  font-size: 12px;
  color: #ff0;
  opacity: 0;
  transition: opacity 0.3s;
  margin-bottom: 5px;
}

.control-row {
  display: flex;
  justify-content: space-between;
  margin: 3px 0;
}

button {
  background: #222;
  color: #0f0;
  border: 2px solid #0f0;
  font-family: monospace;
  cursor: pointer;
  padding: 2px 5px;
  user-select: none;
}

button:active {
  background: #0f0;
  color: #222;
}
#orientation-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(8px);
  background-color: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#orientation-panel img {
  max-width: 80%;
  max-height: 80%;
}

.hidden {
  display: none;
}
/* ===== INVENTARIO GENERAL ===== */
#inventory-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #141414AB;
  padding: 12px;
  border: 3px solid #000000;
  border-radius: 8px;
  display: none; /* Se muestra al abrir inventario */
  z-index: 30;
  font-family: monospace;
  color: white;
  transform-origin: center;
  zoom: 0.8; /* Ajusta tamaño general */
}

/* Grid del inventario (9x3) */
#inventory-grid {
  display: grid;
  grid-template-columns: repeat(9, 36px);
  gap: 4px;
  margin-bottom: 10px;
  justify-content: center;
}

/* Hotbar dentro del inventario */
#hotbar {
  display: none;
}

/* ===== SLOTS ===== */
.slot {
  width: 36px;
  height: 36px;
  background: #0000005E;
  border: 2px solid black;
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.slot img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

.slot.selected {
  border: 2px solid #00FF2E;
}


/* ===== CRAFTING ===== */
#crafting-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

/* Grid de 2x2 */
#crafting-grid {
  display: grid;
  grid-template-columns: repeat(2, 36px);
  grid-template-rows: repeat(2, 36px);
  gap: 4px;
}

.craft-slot,
.craft-slot-3x3 {
  background: #444;
}


/* Flecha de crafteo */
.arrow {
  font-size: 18px;
  font-weight: bold;
  color: white;
}

/* Resultado de crafteo */
#craft-result {
  background: #42764A;
  border: 2px solid black;
}

/* ===== HOTBAR FIJA EN PANTALLA ===== */
#hotbar-fixed {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: rgba(0,0,0,0.5);
  padding: 4px;
  border-radius: 6px;
  z-index: 20;
}

#hotbar-fixed .slot {
  width: 34px;
  height: 34px;
}
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
#split-count {
  font-family: 'Press Start 2P', monospace;
  font-size: 14px;
  color: white;
  padding: 0 6px;
}

#overlay413 {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(8px);
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
/* Contenedor */
#quality-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background-color: #222; /* fondo oscuro */
  border: 4px solid #555; /* borde grueso estilo pixel */
  width: max-content;
  font-family: 'Press Start 2P', monospace; /* fuente pixelada */
  user-select: none;
}

/* Texto */
#quality-controls p {
  margin: 0;
  color: #fff;
  font-size: 12px;
  text-shadow: 1px 1px 0 #000;
}

/* Botones pixel art */
.q-btn {
  background-color: #888; /* color base */
  color: #fff;
  border: 4px solid #555; /* borde grueso */
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  text-shadow: 1px 1px 0 #000;
  transition: all 0.1s; /* efecto rápido */
  outline: none;
  image-rendering: pixelated; /* efecto pixel */
}

/* Hover y activo */
.q-btn:hover {
  background-color: #aaa;
  border-color: #fff;
}

.q-btn:active {
  background-color: #666;
  border-color: #333;
  transform: translate(1px, 1px); /* efecto de “presionado” */
}

/* Espaciado entre botones */
.q-btn + .q-btn {
  margin-left: 4px;
}

#starmp3 {
  font-size: 16px;
  padding: 20px 40px;
  background: #2ecc71;
  color: black;
  border: 4px solid #000;
  cursor: pointer;
  image-rendering: pixelated;
  box-shadow: 4px 4px 0 #000;
  transition: transform 0.1s;
  animation: blink413 1s step-start infinite;
  font-family: 'Press Start 2P', monospace;
}

#starmp3:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0 #000;
}

@keyframes blink413 {
  50% { opacity: 0.4; }
}
#secret-menu {
  position: fixed;
  top: 0;

  width: 240px;
  height: 100%;

  font-family: 'Press Start 2P', monospace;
}
#craft3-blur {
  position: fixed;

  width: 100%;
  height: 100%;

  display: none;
  z-index: 29; /* debajo de #inventory-panel pero encima del juego */
}

#secret-menu.active {
  right: 0; /* se desliza al abrirse */
}

#secret-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #333;
  color: #fff;
  padding: 6px;
  font-size: 12px;
}

#secret-header button {
  background: transparent;
  border: none;

  font-size: 18px;
  cursor: pointer;
}

#secret-content {
  flex: 1;
  overflow-y: auto; /* scroll vertical */
  padding: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

#secret-content img {
  width: 48px;
  height: 48px;
  border: 2px solid #444;
  cursor: pointer;
  image-rendering: pixelated;
}

#secret-content img:active {
  border-color: lime;
}

.slot .count {
  position: absolute;
  bottom: 2px;
  right: 2px;
  color: white;
  font-size: 10px;
  font-family: 'Press Start 2P', monospace;
  image-rendering: pixelated;
  text-shadow: 1px 1px 0 #000; /* contorno negro para más contraste */
  pointer-events: none;
}
#craft-blur {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 29; /* debajo del inventario pero encima del juego */
}

#characterMenu {
  display: flex;
  gap: 30px;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
  background: linear-gradient(135deg, #222, #111);
  border: 2px solid #444;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

.characterOption {
  text-align: center;
  transition: transform 0.2s ease, filter 0.2s ease;
}

.characterOption:hover {
  transform: translateY(-6px);
  filter: brightness(1.1);
}

.characterOption img {
  display: block;
  margin-bottom: 10px;
  border: 3px solid #fff;
  border-radius: 8px;
  width: 100px;
  height: 100px;
  object-fit: cover;
  box-shadow: 0 0 10px rgba(255,255,255,0.3);
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
#inv-blur {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 29; /* 👈 debajo del inventario */
}

.characterOption img:hover {
  border-color: #00ffe7;
  box-shadow: 0 0 15px #00ffe7;
}

.characterOption button {
  margin-top: 8px;
  padding: 6px 12px;
  background: #333;
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 12px;
  border: 2px solid #555;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 3px 0 #111;
  transition: background 0.3s, transform 0.1s;
}

.characterOption button:hover {
  background: #00ffe7;
  color: #111;
  border-color: #00ffe7;
}

.characterOption button:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #111;
}
#chest-blur {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(6px);
  background: rgba(0, 0, 0, 0.4);
  display: none;
  z-index: 5999;
  /* el panel tiene 6000 */
}

</style>
</head>

function resizeCanvas(scale) {
  width  = window.innerWidth;
  height = window.innerHeight;

  canvas.width  = width * scale;
  canvas.height = height * scale;

  canvas.style.width  = width + "px";
  canvas.style.height = height + "px";

  ctx.scale(scale, scale);

}

window.addEventListener("load", () => {
  const starmp3 = document.getElementById("starmp3");
  const player413 = document.getElementById("player413");
  const overlay413 = document.getElementById("overlay413");
  const currentTrackElem = document.getElementById("currentTrack");
  const prevTrackBtn = document.getElementById("prevTrack");
  const nextTrackBtn = document.getElementById("nextTrack");
const particlesToggle = document.getElementById("particles-toggle");
particlesToggle.addEventListener("click", () => {
  particlesEnabled = !particlesEnabled;
  particlesToggle.textContent = "partículas: " + (particlesEnabled ? "sí" : "no");
});

  const tracks413 = [
    "Texturas/Explorer.mp3",
    "Texturas/far.mp3",
    "Texturas/RLX.mp3",
    "Texturas/RLX.mp3",
    "Texturas/Night.mp3"
  ];

  let playlist413 = [];
  let playedTracks = [];
  let currentTrack = "";

  function shufflePlaylist() {
    playlist413 = [...tracks413];
    playedTracks = [];
    pickNextTrack();
  }

  function pickNextTrack() {
    if (playlist413.length === 0) {
      playlist413 = [...playedTracks];
      playedTracks = [];
    }
    const randomIndex = Math.floor(Math.random() * playlist413.length);
    currentTrack = playlist413.splice(randomIndex, 1)[0];
    playedTracks.push(currentTrack);
    updateCurrentTrackDisplay();
    player413.src = currentTrack;
    player413.play().catch(err => console.error(err));
  }

  function pickPrevTrack() {
    if (playedTracks.length > 1) {
      playlist413.unshift(playedTracks.pop());
      currentTrack = playedTracks[playedTracks.length - 1];
      updateCurrentTrackDisplay();
      player413.src = currentTrack;
      player413.play().catch(err => console.error(err));
    }
  }

  function updateCurrentTrackDisplay() {
    const name = currentTrack.split("/").pop();
    currentTrackElem.textContent = `<${name}>`;
  }

  function openFullscreen() {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    } else if (document.documentElement.webkitRequestFullscreen) {
      document.documentElement.webkitRequestFullscreen();
    } else if (document.documentElement.msRequestFullscreen) {
      document.documentElement.msRequestFullscreen();
    }
  }

  starmp3.addEventListener("click", async () => {
    try {
      openFullscreen();
      shufflePlaylist();
      overlay413.style.display = "none";
      player413.muted = false;
      player413.volume = (window.orientation === 90 || window.orientation === -90) ? 1 : 0;
      await player413.play();
    } catch(e) {
      console.error("Error al reproducir audio:", e);
    }
  });

  window.addEventListener("orientationchange", () => {
    if (player413.src) {
      player413.volume = (window.orientation === 90 || window.orientation === -90) ? 1 : 0;
    }
  });

  prevTrackBtn.addEventListener("click", pickPrevTrack);
  nextTrackBtn.addEventListener("click", pickNextTrack);

  // --- aquí se reproduce la siguiente automáticamente ---
  player413.addEventListener("ended", pickNextTrack);
});

// --- controles de volumen ---

// actualizar volumen en pantalla y guardar
function updateVolume() {
  player413.volume = volume;
  volLabel.textContent = Math.round(volume * 100);
  localStorage.setItem("musicVolume", volume.toFixed(2));
}

// bajar volumen
volDown.addEventListener("click", () => {
  volume = Math.max(0, volume - 0.1);
  updateVolume();
});

// subir volumen
volUp.addEventListener("click", () => {
  volume = Math.min(1, volume + 0.1);

});

function generateSpecialBlocksInChunk(chunkX, layer = 1) {
  const chunk = layer === 0 ? chunksBg[chunkX] : chunks[chunkX];
  if (!chunk || !chunk.data) return;

  const data = chunk.data;

  specialBlocks.forEach(cfg => {
    // Si el bloque tiene layer definido y no coincide, saltar
    if (cfg.layer !== undefined && cfg.layer !== layer) return;

    let placed = 0;
    const maxToPlace =
      Math.floor(Math.random() * (cfg.maxPerChunk - cfg.minPerChunk + 1)) +
      cfg.minPerChunk;

    for (let y = 1; y < ROWS - 1; y++) {
      if (!data[y]) continue;
      for (let x = 0; x < CHUNK_SIZE; x++) {
        if (placed >= maxToPlace) return;

        const below = data[y][x];
        const aboveRow = data[y - 1] || [];
        const above = aboveRow[x];

        if (
          below === cfg.onTopOf &&
          !above &&
          y >= cfg.minY &&
          y <= cfg.maxY &&
          Math.random() < cfg.chance
        ) {
          data[y - 1][x] = cfg.block;
          placed++;
        }
      }
    }
  });
}

// --- Generación de la capa de fondo (bg) ---
function generateChunkBg(chunkX) {
  if (chunksBg[chunkX]) return chunksBg[chunkX];

  // ⚙️ Genera el chunk frontal para copiar su base
  let chunk = generateChunk(chunkX);
  let data = [];

  // 📦 Copiar el terreno base pero SIN bloques especiales de capa 1
  for (let y = 0; y < ROWS; y++) {
    data[y] = [];
    for (let x = 0; x < CHUNK_SIZE; x++) {
      let block = chunk.data[y][x];

      // ❌ Eliminar bloques especiales que son solo de la capa 1
      const isLayer1Special = specialBlocks.some(
        sb => sb.block === block && sb.layer === 1
      );

      if (isLayer1Special) {
        // reemplaza la flor por aire o por el bloque base debajo
        data[y][x] = null;
      } else {
        data[y][x] = block;
      }
    }
  }

  // 🌳 Árboles decorativos solo en la capa bg
  for (let x = 0; x < CHUNK_SIZE; x++) {
    for (let y = 0; y < ROWS; y++) {
      if (data[y][x] === "grass" && Math.random() < 0.1) {
        generateTree({ data }, x, y);
      }
    }
  }

  // 🌍 Generar bloques especiales específicos del layer 0 (menas, etc.)
  generateSpecialBlocksInChunk(chunkX, 0);

  chunksBg[chunkX] = { x: chunkX, data };
  return chunksBg[chunkX];
}

function generateTree(chunkBg, localX, groundY){
  // altura del tronco entre 3 y 5
  let height = 3 + Math.floor(Math.random()*3);

  // tronco
  for(let h=0; h<height; h++){
    if(chunkBg.data[groundY-h-1]) // aseguramos que exista fila
      chunkBg.data[groundY-h-1][localX] = 'log';
  }

  // hojas (alrededor de la punta)
  let top = groundY - height;
  for(let dx=-2; dx<=2; dx++){
    for(let dy=-2; dy<=2; dy++){
      let dist = Math.abs(dx) + Math.abs(dy);
      if(dist <= 2){ // forma de cruz / redondeada
        let yy = top+dy;
        let xx = localX+dx;
        if(chunkBg.data[yy] && chunkBg.data[yy][xx]!==undefined && chunkBg.data[yy][xx]===null){
          chunkBg.data[yy][xx] = 'leaf';
        }
      }
    }
  }
}

document.getElementById("split-confirm").onclick = ()=>{
  if (splitFrom !== null && splitTo !== null) {
    let fromItem;

    // obtener origen
    if (typeof splitFrom === "string") {
      if (splitFrom.startsWith("craft:")) {
        fromItem = craftingGrid[parseInt(splitFrom.split(":")[1])];
      } else if (splitFrom.startsWith("craft3:")) {
        fromItem = craftingGrid3x3[parseInt(splitFrom.split(":")[1])];
      }
    } else {
      fromItem = inventory[splitFrom];
    }

    if (!fromItem) return;

    // stack a mover
    let moved = {
      type: fromItem.type,
      texture: fromItem.texture,
      count: splitAmount
    };

    // obtener destino
    let toItem;
    if (typeof splitTo === "string") {
      if (splitTo.startsWith("craft:")) {
        toItem = craftingGrid[parseInt(splitTo.split(":")[1])];
      } else if (splitTo.startsWith("craft3:")) {
        toItem = craftingGrid3x3[parseInt(splitTo.split(":")[1])];
      }
    } else {
      toItem = inventory[splitTo];
    }

    // --- lógica ---
    if (!toItem) {
      // mover parcial
      if (typeof splitTo === "string") {
        if (splitTo.startsWith("craft:")) craftingGrid[parseInt(splitTo.split(":")[1])] = moved;
        else craftingGrid3x3[parseInt(splitTo.split(":")[1])] = moved;
      } else {
        inventory[splitTo] = moved;
      }
      fromItem.count -= splitAmount;
    }
    else if (toItem.type === moved.type) {
      // apilar
      toItem.count += moved.count;
      fromItem.count -= splitAmount;
    }
    else {
      // intercambio
      let temp = { ...toItem };

      if (typeof splitTo === "string") {
        if (splitTo.startsWith("craft:")) craftingGrid[parseInt(splitTo.split(":")[1])] = moved;

function enableTouchInventory() {
  const allSlots = document.querySelectorAll(
    '#inventory-grid .slot, #hotbar .slot, #hotbar-fixed .slot, #crafting-grid .slot, #crafting-grid-3x3 .slot'
  );

  allSlots.forEach((slot, i) => {
    // Detectar el tipo de slot
    if (slot.closest('#crafting-grid')) {
      slot.dataset.type = 'craft';
      slot.dataset.index = i % 4; // 0–3 para el 2x2
    } else if (slot.closest('#crafting-grid-3x3')) {
      slot.dataset.type = 'craft3';
      slot.dataset.index = i % 9; // 0–8 para el 3x3
    } else {
      slot.dataset.type = 'inv';
      slot.dataset.index = i; // inventario o hotbar
    }

    // Eventos de toque/click
    slot.onclick = () => {
      if (!pickedSlot) {
        // Primer toque → seleccionar
        pickedSlot = slot;
        slot.classList.add('selected');
      } else if (pickedSlot === slot) {
        // Segundo toque en el mismo → cancelar selección
        slot.classList.remove('selected');
        pickedSlot = null;
      } else {
        // Segundo toque en otro slot → mover/intercambiar
        const fromType = pickedSlot.dataset.type;
        const toType   = slot.dataset.type;
        const fromIdx  = parseInt(pickedSlot.dataset.index);
        const toIdx    = parseInt(slot.dataset.index);

        // 🔹 Inventario ↔ Inventario
        if (fromType === 'inv' && toType === 'inv') {
          let temp = inventory[toIdx];
          inventory[toIdx] = inventory[fromIdx];
          inventory[fromIdx] = temp;
          renderHotbar();
          initCraftingSlots3x3Selection();
          renderInventoryGrid();
        }

        // 🔹 Inventario → Crafting 2x2
        else if (fromType === 'inv' && toType === 'craft') {
          if (inventory[fromIdx]) {
            if (craftingGrid[toIdx]) {
              craftingGrid[toIdx].count += inventory[fromIdx].count;
            } else {
              craftingGrid[toIdx] = inventory[fromIdx];
            }
            inventory[fromIdx] = null;
            renderHotbar();
            renderInventoryGrid();
            initCraftingSlots3x3Selection();
            renderCrafting();
            checkRecipes();
          }
        }

        // 🔹 Crafting 2x2 → Inventario
        else if (fromType === 'craft' && toType === 'inv') {
          if (craftingGrid[fromIdx]) {
            if (inventory[toIdx]) {
              inventory[toIdx].count += craftingGrid[fromIdx].count;
            } else {
              inventory[toIdx] = craftingGrid[fromIdx];
            }
            craftingGrid[fromIdx] = null;
            renderHotbar();
            renderInventoryGrid();
            initCraftingSlots3x3Selection();
            renderCrafting();
            checkRecipes();
          }

        // 🔹 Inventario → Crafting 3x3

          if (inventory[fromIdx]) {
            if (craftingGrid3x3[toIdx]) {
              craftingGrid3x3[toIdx].count += inventory[fromIdx].count;

              craftingGrid3x3[toIdx] = inventory[fromIdx];

let particles = [];

class Particle {
  constructor(wx, wy, texture, life = 200) {
    this.wx = wx + 0.5;  
    this.wy = wy + 0.5;  

    // velocidad de caída (vertical)
    this.vy = Math.random() * 0.02 + 0.01;

    // parámetros para el balanceo lateral
    this.swingAmplitude = 0.3; // qué tanto se mueve de lado a lado (en bloques)
    this.swingSpeed = 0.05 + Math.random() * 0.05; // velocidad del vaivén
    this.phase = Math.random() * Math.PI * 2; // desfase inicial

    this.life = life;
    this.size = BLOCK_SIZE * 0.15;
    this.texture = texture;
    this.alpha = 1;
    this.time = 0; // contador de frames
  }

  update() {
    this.time++;

    // Movimiento lateral oscilatorio (seno)
    this.wx += Math.sin(this.time * this.swingSpeed + this.phase) * 0.02;

    // Caída vertical
    this.wy += this.vy;

    // Vida y transparencia
    this.life--;
    this.alpha = this.life / 200;
  }

  draw(ctx) {
    if (!this.texture.complete) return;

    const px = this.wx * BLOCK_SIZE - cameraX;
    const py = this.wy * BLOCK_SIZE - cameraY;

    if (px + this.size < 0 || px > width || py + this.size < 0 || py > height) return;

    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.drawImage(this.texture, px, py, this.size, this.size);
    ctx.restore();
  }


  draw(ctx) {
    if (!this.texture.complete) return;

    // convertir coordenadas de mundo a pantalla
    const px = this.wx * BLOCK_SIZE - cameraX;
    const py = this.wy * BLOCK_SIZE - cameraY;

    // dibujar solo si están en pantalla
    if (
      px + this.size < 0 || px > width ||
      py + this.size < 0 || py > height
    ) return;

    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.drawImage(this.texture, px, py, this.size, this.size);
    ctx.restore();
  }
}

function spawnLeafParticles(wx, wy) {
  if (!particlesEnabled) return;
  // 1 o 2 hojitas máximo por frame
  particles.push(new Particle(wx, wy, textures.particle_leaf, 200));
}

function updateParticles(ctx) {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Función para cargar frames con promesas
function loadFrames(path, start = 1, end = 1) {
    return new Promise((resolve) => {
        const frames = [];
        let loaded = 0;
        const total = end - start + 1;

        for (let i = start; i <= end; i++) {
            const img = new Image();
            img.onload = () => {
                loaded++;
                if (loaded === total) resolve(frames);
            };
            img.onerror = () => {
                console.warn(`No se pudo cargar ${start === end ? path : path + i + '.png'}`);
                loaded++;
                if (loaded === total) resolve(frames);
            };
            img.src = start === end ? path : `${path}${i}.png`;
            frames.push(img);
        }

        // Si no hay frames (total=0)
        if (total === 0) resolve(frames);
    });
}
async function loadArrayFiles(files) {
    const frames = [];
    for (let file of files) {
        const img = new Image();
        img.name = file; // <-- clave para offsets
        await new Promise(res => { img.onload = res; img.onerror = res; img.src = `Texturas/${file}`; });
        frames.push(img);
    }
    return frames;
}

      await new Promise(res => { img.onload = res; img.onerror = res; img.src = `Texturas/${src}`; });
      frames.push(img);
    }
    return frames;
  }

function drawPlayer(dt) {
  let frames;

  if (breaking.active) {
    frames = breakFrames;
  } else if (!player.onGround && jumpPressed) {
    frames = jumpFrames;
  } else if (crouching) {
    frames = crouchFrames;
  } else {
    frames = playerFrames;
  }

  if (!frames || frames.length === 0) return;

  if (frames.length > 1 && (leftPressed || rightPressed || breaking.active)) {
    frameTimer += dt;
    if (frameTimer >= 0.2) {
      frameTimer = 0;
      currentFrame = (currentFrame + 1) % frames.length;
    }
  } else {
    currentFrame = 0;
  }

  const playerImg = frames[currentFrame];
  if (!playerImg || !playerImg.complete) return;

  const px = player.x * BLOCK_SIZE - cameraX;
  const py = player.y * BLOCK_SIZE - cameraY;
  const pw = player.width * BLOCK_SIZE;
  const ph = player.height * BLOCK_SIZE;

  // === DIBUJAR JUGADOR ===
  ctx.save();
  if (player.facing === 1) {
    ctx.translate(px + pw, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(playerImg, 0, py, pw, ph);
  } else {
    ctx.drawImage(playerImg, px, py, pw, ph);
  }
  ctx.restore();

  // === DIBUJAR OBJETO EN MANO ===
const frameKey = playerImg.name;
const offset = handOffsets[frameKey];
const HAND_SCALE = 0.5; // 1 = tamaño normal, 0.5 = la mitad, 2 = doble tamaño

const adjust = handAdjustments[frameKey] || { x:0, y:0, scale:1 };


  const selected = inventory[selectedSlot];
  if (offset && selected && selected.texture) {
    const itemTex = new Image();
    itemTex.src = selected.texture;

    ctx.save();

    // 🔑 factor de zoom relativo (80 = tamaño base)
    const zoomFactor = BLOCK_SIZE / 80;

    // 🔑 aplicamos zoom también a la posición
    const posX = (offset.x + adjust.x) * zoomFactor;
    const posY = (offset.y + adjust.y) * zoomFactor;

    if (player.facing === 1) {
      ctx.translate(px + pw - posX, py + posY);
      ctx.scale(-offset.flip * offset.scale * HAND_SCALE * adjust.scale * zoomFactor,
                 offset.scale * HAND_SCALE * adjust.scale * zoomFactor);
    } else {
      ctx.translate(px + posX, py + posY);
      ctx.scale(offset.flip * offset.scale * HAND_SCALE * adjust.scale * zoomFactor,
                offset.scale * HAND_SCALE * adjust.scale * zoomFactor);
    }

    ctx.rotate(offset.rotation * Math.PI / 180);
    ctx.drawImage(itemTex, -12, -12, 24, 24); // centrado
    ctx.restore();
  }
}

const gravity = 0.9 / BLOCK_SIZE;
const jumpPower = -15 / BLOCK_SIZE;

const playerSpeed = 0.12;
let speed = crouching ? playerSpeed * 0.4 : playerSpeed;

let cameraX=0, cameraY=0;

function isBlock(wx, wy){
  const block = getBlock(Math.floor(wx), Math.floor(wy));
  if (!block) return false;
  return hasCollision(block); // solo colisiona si la regla lo permite
}


let collidingLeft=false, collidingRight=false, collidingTop=false, collidingBottom=false;
function movePlayer() {
  collidingLeft=false; collidingRight=false; collidingTop=false; collidingBottom=false;

  // --- Lógica de soporte al agacharse ---
  // --- Lógica de soporte al agacharse ---
if (crouching && player.vx !== 0 && player.onGround) {
  let ny = player.y + player.height + 0.01;
  let underCenter = isBlock(player.x + player.width/2, ny);

  if (player.vx < 0) { // izquierda
    let underLeft = isBlock(player.x, ny);
    if (!underLeft && !underCenter) player.vx = 0;
  } else if (player.vx > 0) { // derecha
    let underRight = isBlock(player.x + player.width, ny);
    if (!underRight && !underCenter) player.vx = 0;
  }
}

  // --- Movimiento horizontal normal ---
  let nx = player.x + player.vx;
  if(player.vx < 0){
    if(!isBlock(nx, player.y) && !isBlock(nx + player.width, player.y) &&
       !isBlock(nx, player.y + player.height - 0.01) && !isBlock(nx + player.width, player.y + player.height - 0.01)) {
      player.x = nx;
    } else { 
      player.vx = 0; 
      collidingLeft = true; 
    }
  } else if(player.vx > 0){
    if(!isBlock(nx, player.y) && !isBlock(nx + player.width, player.y) &&
       !isBlock(nx, player.y + player.height - 0.01) && !isBlock(nx + player.width, player.y + player.height - 0.01)) {
      player.x = nx;
    } else { 
      player.vx = 0; 
      collidingRight = true; 
    }
  }

  // --- Movimiento vertical ---
  player.vy += gravity;
let ny = player.y + player.vy;

  player.onGround = false;

  if(player.vy > 0){ // cayendo
    if(!isBlock(player.x, ny + player.height) && !isBlock(player.x + player.width, ny + player.height)) {
      player.y = ny;
    } else {
      player.y = Math.floor(ny + player.height) - player.height;
      player.vy = 0; 
      player.onGround = true; 
      collidingBottom = true;
    }
  } else if(player.vy < 0){ // subiendo
    if(!isBlock(player.x, ny) && !isBlock(player.x + player.width, ny)) {
      player.y = ny;
    } else {
      player.vy = 0; 
      collidingTop = true;
    }
  }
}

function initInventorySlots() {
  // asignar índices y tipos
  document.querySelectorAll('#inventory-grid .slot').forEach((s, i) => {
    s.dataset.index = i;
    s.dataset.type = "inv";
  });
  document.querySelectorAll('#hotbar .slot').forEach((s, i) => {
    s.dataset.index = i;
    s.dataset.type = "inv";
  });
  document.querySelectorAll('#hotbar-fixed .slot').forEach((s, i) => {
    s.dataset.index = i;
    s.dataset.type = "inv";
  });
  document.querySelectorAll('#crafting-grid .craft-slot').forEach((s, i) => {
    s.dataset.index = i;
    s.dataset.type = "craft";
  });
  document.querySelectorAll('#crafting-grid-3x3 .craft-slot-3x3').forEach((s, i) => {
    s.dataset.index = i;
    s.dataset.type = "craft3";
  });
  
  const allSlots = document.querySelectorAll(
    '#inventory-grid .slot, #hotbar .slot, #hotbar-fixed .slot, #crafting-grid .craft-slot, #crafting-grid-3x3 .craft-slot-3x3'
  );
  
  allSlots.forEach((slot) => {
    slot.onclick = () => {
      const clickedIndex = parseInt(slot.dataset.index);
      const clickedType = slot.dataset.type;
      
      if (selectedSlot === null) {
        // primer click → seleccionar
        selectedSlot = { index: clickedIndex, type: clickedType };
        slot.classList.add('selected');
      }
      else if (selectedSlot.index === clickedIndex && selectedSlot.type === clickedType) {
        // click en el mismo → cancelar
        slot.classList.remove('selected');
        selectedSlot = null;
      }
      else {
        // segundo click
        let fromItem = getItemFromSlot(selectedSlot);
        let toItem = getItemFromSlot({ index: clickedIndex, type: clickedType });
        
        if (fromItem) {
          // --- soporte split-panel ---
          if (fromItem.count > 1) {
            let fromKey = (selectedSlot.type === "inv") ?
              selectedSlot.index :
              (selectedSlot.type === "craft" ? "craft:" + selectedSlot.index : "craft3:" + selectedSlot.index);
            
            let toKey = (clickedType === "inv") ?
              clickedIndex :
              (clickedType === "craft" ? "craft:" + clickedIndex : "craft3:" + clickedIndex);
            
            if (!toItem || (toItem && toItem.type === fromItem.type)) {
              openSplitPanel(fromKey, toKey, fromItem.count);
              return;
            }
          }
          
          // --- mover/apilar/intercambiar normal ---
          if (!toItem) {
            setItemToSlot({ index: clickedIndex, type: clickedType }, { ...fromItem });
            setItemToSlot(selectedSlot, null);
          }
          else if (toItem.type === fromItem.type) {
            toItem.count += fromItem.count;
            setItemToSlot(selectedSlot, null);
          }
          else {
            let temp = { ...toItem };
            setItemToSlot({ index: clickedIndex, type: clickedType }, { ...fromItem });
            setItemToSlot(selectedSlot, temp);
          }
        }
        
        // limpiar selección
        document.querySelectorAll('.slot.selected').forEach(s => s.classList.remove('selected'));
        selectedSlot = null;
        
        renderHotbar();
        initCraftingSlots3x3Selection();
        renderInventoryGrid();

        // 🔹 refrescar resultado según el modo
        if (usingCrafting3x3) {
          checkRecipes3x3();
          renderCrafting3x3();
        } else {
          checkRecipes();
          renderCrafting();
        }
      }
    };
  });
}

  if(slot.type==="craft") craftingGrid[slot.index] = item;
  if(slot.type==="craft3") craftingGrid3x3[slot.index] = item;

const walkSound = new Audio("Texturas/walk.mp3");
walkSound.volume = parseFloat(localStorage.getItem("sfxVolume")) || 1;
walkSound.preload = "auto";
walkSound.loop = false;   // no repetir automático

let lastStepTime = 0;      // marca del último paso
const stepDelay = 400;     // milisegundos entre pasos (~0.4s)

function playWalkSound() {
  const now = Date.now();

  if (player.onGround && (leftPressed || rightPressed)) {
    // ¿ha pasado suficiente tiempo desde el último paso?
    if (now - lastStepTime > stepDelay) {
      lastStepTime = now;

      walkSound.pause();            // por seguridad
      walkSound.currentTime = 0.1;    // arranca en el seg 1
      walkSound.play().catch(()=>{});

      // cortar en el segundo 2
      const stopAt = 0.5;
      const checker = setInterval(() => {
        if (walkSound.currentTime >= stopAt || walkSound.paused) {
          walkSound.pause();
          walkSound.currentTime = 0.5;
          clearInterval(checker);
        }
      }, 30);
    }
  } else {
    // Si deja de caminar o está en el aire → parar sonido inmediatamente
    if (!walkSound.paused) {
      walkSound.pause();
      walkSound.currentTime = 1;
    }
    lastStepTime = 0; // reset al soltar
  }
}

      let slot = craftingGrid3x3[i];

      if ((slot && slot.type) !== need) {
        match = false;
        break;
      }

    if (match) {

        type: recipe.result.type,
        texture: recipe.result.texture,

}

function checkRecipes() {
  craftResult = null;

  for (let recipe of recipes) {
    let match = true;
    for (let i = 0; i < 4; i++) {
      const needed = recipe.pattern[i];
      const slot = craftingGrid[i];

      if (needed === null && slot) { match = false; break; }
      if (needed && (!slot || slot.type !== needed)) { match = false; break; }

    if (match) {
      craftResult = {
        type: recipe.result.type,
        texture: recipe.result.texture,
        count: recipe.result.baseCount   // 👈 solo el baseCount
      };
      break;
    }
  }
}

function handleBreaking(dt) {
  // si no está activo el modo romper o si el jugador se mueve → cancelar
  if (!breakMode || leftPressed || rightPressed || jumpPressed) {
    if (breakMode && (leftPressed || rightPressed || jumpPressed)) {
      // desactivar PRI si comenzamos a movernos
      breakMode = false;
      priBtn.classList.remove('active');
    }
    stopBreaking();
    return;
  }
let wx, wy;

// --- Abajo (incluye agachado en suelo) ---
if ((crouching && player.onGround) || lastDirection.dy > 0) {
  wx = Math.floor(player.x + player.width / 2);
  wy = Math.floor(player.y + player.height); // 👈 sin +1
}
// --- Arriba ---
else if (lastDirection.dy < 0) {
  wx = Math.floor(player.x + player.width / 2);
  wy = Math.floor(player.y - 1); // bloque justo arriba
}
// --- Izquierda / Derecha ---
else if (lastDirection.dx !== 0) {
  wx = Math.floor(player.x + player.width / 2) + lastDirection.dx; // 👈 bloque lateral completo
  wy = Math.floor(player.y + player.height / 2);
}
// --- Por defecto ---
else {
  wx = Math.floor(player.x + player.width / 2);
  wy = Math.floor(player.y + player.height / 2);
}

  // si ya estamos rompiendo y es el mismo bloque, seguimos
  if (breaking.active && breaking.wx === wx && breaking.wy === wy) {
    breaking.delay += dt;
    if (breaking.delay >= 0.05) updateBreaking(dt);
    return;
  }

  // nuevo objetivo: revisamos capa frente y fondo
  const frontType = getBlock(wx, wy);
  const bgType    = getBlockBg(wx, wy);

  if (!frontType && !bgType) {
    stopBreaking();
    return;
  }

  // prioriza frente; si hay fondo también, lo encolamos
  if (frontType) {
    breaking.active = true;
    breaking.wx = wx; breaking.wy = wy;
    breaking.type = frontType;
    breaking.layer = 'front';
    breaking.time = 0; breaking.progress = 0; breaking.delay = 0;
    breaking.queueBg = !!bgType;
  } else {
    // no hay frente, pero sí fondo -> rompemos fondo directamente
    breaking.active = true;
    breaking.wx = wx; breaking.wy = wy;
    breaking.type = bgType;
    breaking.layer = 'bg';
    breaking.time = 0; breaking.progress = 0; breaking.delay = 0;
    breaking.queueBg = false;
  }
}


function updateBreaking(dt) {
  if (!breaking.active) return;

  // impedir romper mientras nos movemos (seguridad extra)
  if (leftPressed || rightPressed || jumpPressed) {
    breakMode = false;
    priBtn.classList.remove('active');
    stopBreaking();
    return;
  }

  // tiempo base según tipo
  let maxTime = blockData[breaking.type]?.time || 5;

  // herramienta reduce tiempo
  const slot = inventory[selectedSlot];
  if (slot && tools[slot.type]) {
    const tool = tools[slot.type];
    if (tool.fastBlocks.includes(breaking.type)) {
      maxTime *= tool.speed;
    }
  }

  breaking.time += dt;
  breaking.progress = Math.min(breaking.time / maxTime, 1);

  if (breaking.progress >= 1) {
    const blockType = breaking.type; // guardamos antes de eliminar

    // aplicar la rotura según la capa actual
    if (breaking.layer === 'front') {
      setBlock(breaking.wx, breaking.wy, null);
      dropBlockItem(blockType, breaking.wx, breaking.wy);
    } else if (breaking.layer === 'bg') {
      setBlockBg(breaking.wx, breaking.wy, null);
      dropBlockItem(blockType, breaking.wx, breaking.wy);
    }

    // si había cola para bg y acabamos de romper front => iniciar bg
    if (breaking.layer === 'front' && breaking.queueBg) {
      const bgType = getBlockBg(breaking.wx, breaking.wy);
      if (bgType) {
        breaking.type = bgType;
        breaking.layer = 'bg';
        breaking.time = 0;
        breaking.progress = 0;
        breaking.delay = 0;
        breaking.queueBg = false;
        return;
      }
    }

    // si no hay más que romper, detener
    stopBreaking();
  }
}

function stopBreaking(){
  breaking.active = false;
  breaking.wx = 0; breaking.wy = 0; breaking.type = null;
  breaking.time = 0; breaking.progress = 0; breaking.delay = 0;
  breaking.layer = null; breaking.queueBg = false;
}

  });

  // inventario del jugador
  const playerSlots = document.querySelectorAll('#cofre-inventory .slot');
  playerSlots.forEach((btn, i) => {
    btn.innerHTML = '';
    const item = inventory[i];
    if (item) {
      const img = document.createElement('img');
      img.src = item.texture;
      btn.appendChild(img);

      if (item.count > 1) {
        const countDiv = document.createElement('div');
        countDiv.classList.add('count');
        countDiv.textContent = item.count;
        btn.appendChild(countDiv);
      }
    }
  });
}

// lógica de clicks
function enableChestSelection() {
  const chestInv = chests[chestOpenKey] || (chests[chestOpenKey] = new Array(27).fill(null));

  // slots del cofre
  const chestSlots = document.querySelectorAll('#cofre-grid .slot');
  chestSlots.forEach((slot, i) => {
    slot.onclick = () => {
      const chestInv = chests[chestOpenKey];
      const item = chestInv[i];
      if (item) {
        // mover stack completo al inventario
        addItem(item.type, item.count, item.texture);
        chestInv[i] = null;
        renderChest();
      }
    };
  });

  // slots del inventario
  const playerSlots = document.querySelectorAll('#cofre-inventory .slot');
  playerSlots.forEach((slot, i) => {
    slot.onclick = () => {
      const item = inventory[i];
      if (item) {
        const chestInv = chests[chestOpenKey];

        // buscar stack existente en el cofre
        let existing = chestInv.find(s => s && s.type === item.type);
        if (existing) {
          existing.count += item.count;
          inventory[i] = null;
        } else {
          // buscar slot vacío
          let empty = chestInv.findIndex(s => !s);
          if (empty >= 0) {
            chestInv[empty] = { ...item };
            inventory[i] = null;
          } else {
            console.log("Cofre lleno!");
            return;
          }
        }

        renderHotbar();
        renderInventoryGrid();
        renderChest();
      }
    };
  });
}

let dayspeed = 1; // 1 = ciclo en 25 min
const DAY_LENGTH = 25 * 60 * 1000;
const TRANSITION_TIME = 3000;

const phases = [
  { name: "amanecer",    color: [255, 120, 50]  },
  { name: "día",         color: [70, 200, 255]  },
  { name: "medio día",   color: [0, 150, 255]   },
  { name: "tarde",       color: [255, 180, 40]  },
  { name: "atardecer",   color: [255, 60, 80]   },
  { name: "noche",       color: [30, 30, 100]   },
  { name: "media noche", color: [5, 5, 40]      }
];

let dayStart = performance.now();
let lastPhaseIndex = 0;
let transitionStart = performance.now();
let transitioning = false;

function lerp(a, b, t) { return a + (b - a) * t; }
function rgbToStr(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

function getCurrentSkyColor() {
  let now = performance.now();
  let elapsed = ((now - dayStart) * dayspeed) % DAY_LENGTH;
  let phaseDuration = DAY_LENGTH / phases.length;
  let phaseIndex = Math.floor(elapsed / phaseDuration);

  if (phaseIndex !== lastPhaseIndex && !transitioning) {
    transitioning = true;
    transitionStart = now;
    lastPhaseIndex = phaseIndex;
  }

  let currentColor = phases[phaseIndex].color;
  let prevIndex = (phaseIndex - 1 + phases.length) % phases.length;
  let prevColor = phases[prevIndex].color;

  if (transitioning) {
    let t = (now - transitionStart) / TRANSITION_TIME;
    if (t >= 1) {
      t = 1;
      transitioning = false;
    }
    return [
      Math.round(lerp(prevColor[0], currentColor[0], t)),
      Math.round(lerp(prevColor[1], currentColor[1], t)),
      Math.round(lerp(prevColor[2], currentColor[2], t))
    ];
  } else {
    return currentColor;
  }
}

// === Pintar franjas horizontales fijas ===
function drawSkyStripes() {
  const baseColor = getCurrentSkyColor();

  // generar 4 tonos derivados (más claros/osc.)
  const stripes = [
    [baseColor[0], baseColor[1], baseColor[2]],
    [Math.min(255, baseColor[0] + 30), Math.min(255, baseColor[1] + 30), Math.min(255, baseColor[2] + 30)],
    [Math.max(0, baseColor[0] - 20), Math.max(0, baseColor[1] - 20), Math.max(0, baseColor[2] - 20)],
    [Math.max(0, baseColor[0] - 40), Math.max(0, baseColor[1] - 40), Math.max(0, baseColor[2] - 40)]
  ];

  const stripeHeight = height / stripes.length;

  for (let i = 0; i < stripes.length; i++) {
    ctx.fillStyle = rgbToStr(stripes[i]);
    ctx.fillRect(0, i * stripeHeight, width, stripeHeight);
  }
}

// Touch para colocar bloque

// Juego principal
let lastTime = performance.now();
function gameLoop(time){
  let dt = (time - lastTime)/1000;
  lastTime = time;

  ctx.clearRect(0,0,width,height);

// velocidad dinámica: normal o agachado
let speed = crouching ? playerSpeed * 0.4 : playerSpeed;

player.vx = 0;
if (leftPressed) player.vx = -speed;
if (rightPressed) player.vx = speed;


if (jumpPressed && player.onGround) player.vy = jumpPower;

  movePlayer();
  cameraX = player.x*BLOCK_SIZE - width/2 + BLOCK_SIZE/2;
  cameraY = player.y*BLOCK_SIZE - height/2 + BLOCK_SIZE/2;
drawSkyStripes(); // cielo con franjas

  handleBreaking(dt);
  updateBreaking(dt);
playWalkSound();

  drawChunks();
  drawBreaking();
if (particlesEnabled) {
  updateParticles(ctx);
}
  drawPlayer(dt);

  requestAnimationFrame(gameLoop);
}
gameLoop();
